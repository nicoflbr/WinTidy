name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            exe: powershell
          - name: PowerShell 7 (Windows)
            os: windows-latest
            exe: pwsh
          - name: PowerShell 7 (Linux)
            os: ubuntu-latest
            exe: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in 'Test-Parse', 'Test-Report', 'Test-Hardware', 'Test-GuiApi', 'Test-Update', 'Test-Debloat') {
            Write-Host "::group::$t"
            $out = @(& ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File "tests/$t.ps1" 2>&1 | ForEach-Object { Write-Host $_; "$_" })
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              $failed++
              Write-Host "::error title=$t::$t failed (exit code $code)"
              # the failed checks (or, if the script itself broke, its last lines) as annotations: visible without opening the log
              $first = 0
              for ($k = 0; $k -lt $out.Count; $k++) { if ($out[$k] -match '^FAILED|Exception|^At ') { $first = $k; break } }
              $part = @($out | Select-Object -Skip $first -First 14 | ForEach-Object { ($_ -replace '[\r\n]', ' ' -replace '%', '%25').Trim() })
              Write-Host "::error title=$t::$($part -join '%0A')"
            }
          }
          exit $failed
