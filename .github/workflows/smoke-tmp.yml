name: Smoke (temporary)
on:
  push:
    branches: [feature/auto-update]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        exe: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - name: Live check against GitHub
        shell: pwsh
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File tests/smoke-tmp.ps1
          exit $LASTEXITCODE
